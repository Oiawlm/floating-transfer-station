name: 质量门

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: 格式、测试与构建
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: 还原依赖
        run: dotnet restore FloatingTransferStation.slnx
      - name: 验证格式
        run: dotnet format FloatingTransferStation.slnx --verify-no-changes --no-restore
      - name: 运行 Release 测试
        run: dotnet test FloatingTransferStation.slnx -c Release --no-restore
      - name: 严格 Release 构建
        run: dotnet build FloatingTransferStation.slnx -c Release --no-restore -warnaserror
