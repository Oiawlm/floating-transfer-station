name: 质量门

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: 格式、测试、构建与安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: 还原依赖
        run: dotnet restore FloatingTransferStation.slnx
      - name: 验证格式
        run: dotnet format FloatingTransferStation.slnx --verify-no-changes --no-restore
      - name: 运行 Release 测试、安装清理契约与打包
        env:
          FTS_CATEGORY_SWITCH_EVIDENCE_DIR: ${{ runner.temp }}/category-switch-evidence
        run: '& .\scripts\build-release.ps1 -DotnetPath (Get-Command dotnet).Source'
      - name: 严格 Release 构建
        run: dotnet build FloatingTransferStation.slnx -c Release --no-restore -warnaserror
      - name: 保存跨分类交互截图
        uses: actions/upload-artifact@v7
        with:
          name: category-switch-evidence
          path: ${{ runner.temp }}/category-switch-evidence/*.png
          if-no-files-found: error
          retention-days: 30
