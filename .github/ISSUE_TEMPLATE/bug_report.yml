name: 报告一个问题
description: 告诉我们哪里没有按预期工作
title: "[问题] "
labels: ["类型：缺陷", "状态：待确认"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请只提交可以公开的信息，不要上传私人内容、账号信息或完整用户数据目录。
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
      description: 从软件启动前或操作开始前写起，按顺序列出步骤。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你原本希望发生什么
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 其他线索
      description: 可以附经过隐私检查的截图、录屏或简短错误信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有找到相同问题。
          required: true
        - label: 我没有在附件中包含私人内容、凭据或完整用户数据。
          required: true
